<style>
.latinizado-todos { background: none; border: 1px solid currentColor; border-radius: 0.3em; color: inherit; cursor: pointer; font: inherit; font-size: 0.85em; margin: 0.5em 0 1em 0; padding: 0.25em 0.7em; }
.latinizado-botao { background: none; border: none; border-radius: 0.3em; color: inherit; font: inherit; padding: 0 0.35em; text-align: inherit; cursor: pointer; }
.latinizado-botao[aria-expanded="false"] { background: rgba(128, 128, 128, 0.3); }
.latinizado-botao[aria-expanded="false"] .latinizado-texto { visibility: hidden; }
</style>
<script>
// Encobre o texto latinizado até o clique. Vale para as colunas de tabela com o
// título "Latinizado" e para os trechos marcados no texto com [...]{.latinizado}.
document.addEventListener("DOMContentLoaded", function () {
  var alvos = [];

  document.querySelectorAll("main table").forEach(function (tabela) {
    var titulos = Array.from(tabela.querySelectorAll("thead th"));
    var coluna = titulos.findIndex(function (th) {
      return th.textContent.trim().toLowerCase() === "latinizado";
    });
    if (coluna === -1) return;
    tabela.querySelectorAll("tbody tr").forEach(function (linha) {
      if (linha.cells[coluna]) alvos.push(linha.cells[coluna]);
    });
  });
  document.querySelectorAll("main span.latinizado").forEach(function (trecho) {
    alvos.push(trecho);
  });

  if (!alvos.length) return;

  // Ordem de leitura, para o botão geral ficar antes do primeiro texto encoberto.
  alvos.sort(function (a, b) {
    return a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1;
  });

  var botoes = alvos.map(function (alvo) {
    var botao = document.createElement("button");
    var texto = document.createElement("span");
    botao.type = "button";
    botao.className = "latinizado-botao";
    texto.className = "latinizado-texto";
    while (alvo.firstChild) texto.appendChild(alvo.firstChild);
    botao.appendChild(texto);
    alvo.appendChild(botao);
    botao.addEventListener("click", function () {
      definir(botao, botao.getAttribute("aria-expanded") === "false");
      atualizarGeral();
    });
    return botao;
  });

  var geral = document.createElement("button");
  geral.type = "button";
  geral.className = "latinizado-todos";
  var bloco = alvos[0].closest("table, ul, ol, .callout") || alvos[0].closest("p");
  bloco.parentNode.insertBefore(geral, bloco);

  function definir(botao, visivel) {
    botao.setAttribute("aria-expanded", visivel ? "true" : "false");
    if (visivel) botao.removeAttribute("aria-label");
    else botao.setAttribute("aria-label", "Mostrar latinizado");
  }

  function atualizarGeral() {
    var todosVisiveis = botoes.every(function (b) {
      return b.getAttribute("aria-expanded") === "true";
    });
    geral.textContent = todosVisiveis ? "Ocultar todo o latinizado" : "Mostrar todo o latinizado";
    geral.dataset.mostrar = todosVisiveis ? "nao" : "sim";
  }

  geral.addEventListener("click", function () {
    var visivel = geral.dataset.mostrar === "sim";
    botoes.forEach(function (b) { definir(b, visivel); });
    atualizarGeral();
  });

  botoes.forEach(function (b) { definir(b, false); });
  atualizarGeral();
});
</script>
